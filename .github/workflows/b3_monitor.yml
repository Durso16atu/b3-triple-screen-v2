name: B3 Triple Screen Real-Time Monitor

on:
  schedule:
    # Executa nos minutos 15 e 45 entre 12h e 21h UTC (09h15 às 18h45 BRT, cobrindo pré-mercado e pregão B3).
    # Minutos fora de pico (:15 e :45) evitam os congestionamentos de fila do runner em :00 e :30.
    - cron: '15,45 12-21 * * 1-5'
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
    env:
      TZ: America/Sao_Paulo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Rodar o pipeline atuarial
        run: |
          set -e
          python src/pipeline.py

      - name: Rodar os testes de validação do contrato (Quality Gate)
        run: |
          set -e
          python -m unittest tests/test_schema_and_pipeline.py

      - name: Commitar e fazer push do data/latest.json caso haja alteração
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          if git diff --staged --quiet; then
            echo "Nenhuma alteração de dados detectada."
          else
            git commit -m "chore(data): atualizar latest.json intradiario [skip ci]"
            git pull --rebase -X theirs origin main
            git push origin main
          fi

      - name: Preparar Artefatos do Site (_site)
        run: |
          mkdir -p _site
          cp -r frontend/* _site/
          mkdir -p _site/data
          cp -r data/* _site/data/
          touch _site/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload do Artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
