name: B3 Triple Screen Real-Time Monitor

on:
  schedule:
    # Dispara a cada 15 minutos durante o pregão B3 (10h às 18h BRT = 13h às 21h UTC)
    - cron: '*/15 12-21 * * 1-5'
    # Disparos complementares em minutos intermediários para contornar retenções de fila do GitHub
    - cron: '5,25,45 12-21 * * 1-5'
  workflow_dispatch:

concurrency:
  group: "b3-monitor"
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
    env:
      TZ: America/Sao_Paulo

    steps:
      - name: Verificar janela operacional B3 (protecao contra atraso de fila do GitHub)
        id: b3_gate
        run: |
          DOW=$(date +%u)
          HM=$(date +%H%M)
          echo "Horario atual America/Sao_Paulo: DOW=$DOW HM=$HM (event=${{ github.event_name }})"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$DOW" -gt 5 ] || [ "$((10#$HM))" -lt 945 ] || [ "$((10#$HM))" -gt 1900 ]; then
              echo "Execucao agendada fora da janela operacional B3 (Seg-Sex 09:45-19:00 BRT). Ignorando."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "should_run=true" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.b3_gate.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Setup Python
        if: steps.b3_gate.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        if: steps.b3_gate.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Rodar o pipeline atuarial
        if: steps.b3_gate.outputs.should_run == 'true'
        run: |
          set -e
          python src/pipeline.py

      - name: Rodar os testes de validação do contrato (Quality Gate)
        if: steps.b3_gate.outputs.should_run == 'true'
        run: |
          set -e
          pytest tests/test_schema_and_pipeline.py

      - name: Commitar e fazer push do data/latest.json caso haja alteração
        if: steps.b3_gate.outputs.should_run == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          if git diff --staged --quiet; then
            echo "Nenhuma alteração de dados detectada."
          else
            git commit -m "chore(data): atualizar latest.json intradiario"
            git pull --rebase -X theirs origin main
            git push origin main
          fi

      - name: Preparar Artefatos do Site (_site)
        if: steps.b3_gate.outputs.should_run == 'true'
        run: |
          mkdir -p _site
          cp -r frontend/* _site/
          mkdir -p _site/data
          cp -r data/* _site/data/
          touch _site/.nojekyll

      - name: Configurar GitHub Pages
        if: steps.b3_gate.outputs.should_run == 'true'
        uses: actions/configure-pages@v5

      - name: Upload do Artefato do Pages
        if: steps.b3_gate.outputs.should_run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy no GitHub Pages
        if: steps.b3_gate.outputs.should_run == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
