name: B3 Triple Screen Real-Time Monitor

on:
  schedule:
    - cron: '*/30 13-20 * * 1-5'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Rodar o pipeline atuarial
        run: python src/pipeline.py

      - name: Rodar os testes de validação do contrato (Quality Gate)
        run: python -m unittest tests/test_schema_and_pipeline.py

      - name: Commitar e fazer push do data/latest.json caso haja alteração
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          if git diff --staged --quiet; then
            echo "Nenhuma alteração de dados detectada."
          else
            git commit -m "chore(data): atualizar latest.json intradiario [skip ci]"
            git push origin main
          fi
